; Proper Horse Controls settings, read at startup and when the Reload key is pressed.
; To change values, edit the file and press the Reload key. Logging is the exception, and needs a game restart.
; Settings missing from this file are added with their defaults at startup.

[Features]
; Set to 0 to go back to camera-relative movement. This also turns off horsie reversing,
; wagon S reverse, and stick/S tap braking.
; default 1
CameraDetached=1
; Set to 0 to turn off slowing the mount with a tap of S, the brake key or back on the stick.
; S and stick back only work when CameraDetached=1
; W+S still works even if CameraDetached=0
; default 1
TapBrake=1

[Steering]
; How long A and D take to reach full steering with W held, in milliseconds, from 0 to 500.
; Steering starts from straight ahead and builds up over this time, and starts over when you switch between A and D.
; Lower is faster, and 0 steers fully at once. Gamepad sticks aren't affected.
; default 300
KeyRampMs=300

; The steering bias sets how far A or D turns the mount, from 0 (straight ahead) to 1 (straight sideways).
; Only applies when W and A/D are both held at the same time, or the stick is pushed forward and to one side.
; Steering is capped at 0.94, so higher values turn the same as 0.94.
; Speeds are in m/s, from 0 to 20. A horse walks at about 1.6, trots at 3.6, canters at 6.7 and gallops at 10.

; The speed at and below which LowSpeedBias applies.
; default 2.2
LowSpeed=2.2
; How much influence A/D have when W is held AND the mount is at or below LowSpeed
; default 0.89
LowSpeedBias=0.89

; The speed at and above which HighSpeedBias applies. 
; Between LowSpeed and HighSpeed, the bias blends from one to the other.
; default 4.8
HighSpeed=4.8
; How much influence A/D have when W is held AND the mount is at or above HighSpeed
; default 0.61
HighSpeedBias=0.61

[BackwardSpeed]
; How fast S walks each kind of mount backward, in m/s, from 0.2 to 6.
; Raise or lower a value until the feet match the ground. Mounts of one kind share a value.
; The ibex uses CD_R0001_Horse, the snow deer uses CD_M0002_Reindeer, and the tiger and lion use CD_M0002_Wolf_Elite.
CD_R0001_Horse=1.0
CD_M0002_Camel=1.9
CD_M0002_Reindeer=1.2
CD_M0002_Elephant=1.0
CD_M0002_BattleBoar=1.6
CD_M0002_Bear=1.8
CD_M0002_Wolf=1.8
CD_M0002_Wolf_Elite=1.7
CD_M0002_Wolf_Elite_Big=1.8
CD_M0002_Wolf_Boss=1.8
CD_R0034_Iguana=1.2
CD_R0035_CarmaBirdsaurus=1.6
CD_M0003_CucuBird=1.0
CD_R0012_Wagon_0001=1.0

[Reverse]
; Set to 0 to swap which way A and D curve the mount or wagon while reversing. Forward steering doesn't change.
; default 1
InvertSteer=1
; How far a gamepad stick can lean sideways and still count as straight back, from 0 to 1.
; 0 is no leeway, 0.5 allows a 45 degree lean, and 1 ignores left and right while pulling back.
; default 0.30
StickDeadzone=0.30

[Keys]
; The key that toggles the mod on and off.
; Accepted: F1 to F24, A to Z, 0 to 9, Numpad0 to Numpad9, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock.
; W, A, S and D can't be used.
; default F5
Toggle=F5
; The key that reloads this file while the game is running. Accepts the same keys as Toggle.
; Setting it to the same key as Toggle makes that key do both.
; default End
Reload=End

[Debug]
; if 0, will only log if the mod fails to start.
; if 1, will capture full riding data to a log and csv file, which may be useful to help reproduce and fix any wild bugs
; 1 hour of riding = about 10MB of logs.
; log files are overwritten on every game start, so save any logs you want to keep for sharing.
Logging=1
