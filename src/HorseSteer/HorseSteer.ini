; HorseSteer settings, read once at startup. 
; To change values, edit the file, and restart the game.

[BackwardSpeed]
; How fast S walks each kind of mount backward, in m/s, from 0.2 to 6.
; Raise or lower a value until the feet match the ground. Mounts of one kind share a value.
; The ibex uses CD_R0001_Horse, the snow deer uses CD_M0002_Reindeer, and the tiger and lion use CD_M0002_Wolf_Elite.
CD_R0001_Horse=1.0
CD_M0002_Camel=1.9
CD_M0002_Reindeer=1.2
CD_M0002_Elephant=1.0
CD_M0002_BattleBoar=1.6
CD_M0002_Bear=1.8
CD_M0002_Wolf=1.8
CD_M0002_Wolf_Elite=1.7
CD_M0002_Wolf_Elite_Big=1.8
CD_M0002_Wolf_Boss=1.8
CD_R0034_Iguana=1.2
CD_R0035_CarmaBirdsaurus=1.6
CD_M0003_CucuBird=1.0
CD_R0012_Wagon_0001=1.0

[Reverse]
; How much A or D curves the path while walking backward, from 0.1 to 0.8. This doesn't change how fast the mount turns.
; default 0.56
SteerInput=0.56

[Debug]
; if 0, will only log if the mod fails to start.
; if 1, will capture full riding data to a log and csv file, which may be useful to help reproduce and fix any wild bugs
; 1 hour of riding = about 10MB of logs.
; log files are overwritten on every game start, so save any logs you want to keep for sharing.
Logging=1
